<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SK BATTLE · PIN Lock</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#102b50,#050b18 70%);font-family:Arial,sans-serif;color:#eef8ff;padding:20px}
    .card{width:min(100%,390px);padding:32px 26px;background:#0b1830;border:1px solid #19dfff;border-radius:18px;box-shadow:0 0 28px #00cfff22;text-align:center}
    .mark{font-size:14px;letter-spacing:3px;color:#1ce4ff;font-weight:800}.card h1{font-size:25px;margin:14px 0 8px}.card p{color:#a9bdd6;font-size:14px;margin:0 0 22px}
    input{width:100%;padding:14px;border:1px solid #284b70;border-radius:10px;background:#061024;color:white;text-align:center;font-size:24px;letter-spacing:9px;outline:none}
    button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:#12d9f4;color:#04101d;font-weight:800;font-size:16px;cursor:pointer}.flash{color:#ff9b9b;margin-bottom:12px;font-size:14px}
  </style>
</head>
<body><main class="card"><div class="mark">SK BATTLE</div><h1>Enter App PIN</h1><p>অ্যাপটি খুলতে PIN লিখুন</p>
  {% with messages = get_flashed_messages() %}{% if messages %}{% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
  <form method="post"><input name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="••••" aria-label="App PIN" required autofocus><button type="submit">UNLOCK APP</button></form>
</main></body></html>

{% extends "base.html" %}
{% block title %}Admin Login | SK BATTLE{% endblock %}
{% block content %}
<section class="single-auth">
    <div class="form-panel">
        <div class="eyebrow">CONTROL ROOM</div>
        <h1>Admin Login</h1>
        <p class="muted">Sign in to access the admin panel.</p>

        <form method="post" class="stack-form">
            <label>
                Admin Password
                <input type="password" name="password" required placeholder="Admin password">
            </label>
            <button class="btn btn-primary btn-block" type="submit">Login</button>
        </form>

        <a class="back-link" href="{{ url_for('home') }}">← Back to Home</a>
    </div>
</section>
{% endblock %}
